name: Build fwjz VIP Menu Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create Source Code
        run: |
          cat << 'EOF' > fwjz.m
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <mach/mach.h>
          #import <mach/mach_time.h>

          @interface FWJZManager : NSObject <UITextFieldDelegate>
          @property (nonatomic, strong) UIWindow *overlayWindow;
          @property (nonatomic, strong) UILabel *overlayLabel;
          @property (nonatomic, strong) UIWindow *menuWindow;
          @property (nonatomic, strong) UIView *menuContainer;
          @property (nonatomic, strong) CADisplayLink *displayLink;
          @property (nonatomic, assign) NSInteger frameCount;
          @property (nonatomic, assign) CFTimeInterval lastTime;
          @property (nonatomic, assign) CGFloat hue;
          @property (nonatomic, strong) NSString *customTitle;
          @property (nonatomic, assign) BOOL showFPS;
          @property (nonatomic, assign) BOOL showRAM;
          @property (nonatomic, assign) BOOL showDate;
          + (instancetype)shared;
          - (void)setup;
          - (void)toggleMenu;
          @end

          @implementation FWJZManager

          + (instancetype)shared {
              static FWJZManager *inst = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ inst = [[FWJZManager alloc] init]; });
              return inst;
          }

          static double getMemoryUsage(void) {
              struct task_vm_info vm;
              mach_msg_type_number_t c = TASK_VM_INFO_COUNT;
              if (task_info(mach_task_self(), TASK_VM_INFO, (task_info_t)&vm, &c) == KERN_SUCCESS) {
                  return (double)vm.phys_footprint / (1024.0 * 1024.0);
              }
              return 0.0;
          }

          - (void)setup {
              self.customTitle = @"fwjz";
              self.showFPS = YES;
              self.showRAM = YES;
              self.showDate = YES;
              self.hue = 0.0;
              self.frameCount = 0;
              self.lastTime = CACurrentMediaTime();

              // 1. HUD Overlay mờ kính góc màn hình
              self.overlayWindow = [[UIWindow alloc] initWithFrame:CGRectMake(20, 50, 246, 48)];
              self.overlayWindow.windowLevel = UIWindowLevelStatusBar + 100.0;
              self.overlayWindow.backgroundColor = [UIColor colorWithWhite:0.05 alpha:0.65];
              self.overlayWindow.layer.cornerRadius = 12.0;
              self.overlayWindow.layer.masksToBounds = YES;
              self.overlayWindow.userInteractionEnabled = YES;

              UIBlurEffect *blur = [UIBlurEffect effectWithStyle:UIBlurEffectStyleDark];
              UIVisualEffectView *blurView = [[UIVisualEffectView alloc] initWithEffect:blur];
              blurView.frame = self.overlayWindow.bounds;
              blurView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.overlayWindow addSubview:blurView];

              self.overlayLabel = [[UILabel alloc] initWithFrame:self.overlayWindow.bounds];
              self.overlayLabel.textAlignment = NSTextAlignmentCenter;
              self.overlayLabel.numberOfLines = 2;
              self.overlayLabel.font = [UIFont boldSystemFontOfSize:11.5];
              [self.overlayWindow addSubview:self.overlayLabel];

              // Kéo thả HUD
              UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(onPan:)];
              [self.overlayWindow addGestureRecognizer:pan];

              // Chạm đúp vào HUD để mở nhanh Menu
              UITapGestureRecognizer *tapHUD = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(toggleMenu)];
              tapHUD.numberOfTapsRequired = 2;
              [self.overlayWindow addGestureRecognizer:tapHUD];

              [self.overlayWindow setHidden:NO];

              // 2. Tạo Menu Cài Đặt
              [self buildMenuUI];

              // 3. Cử chỉ toàn màn hình: Nhấp 2 lần bằng 3 ngón tay để bật/tắt Menu
              UITapGestureRecognizer *tripleTouch = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(toggleMenu)];
              tripleTouch.numberOfTouchesRequired = 3;
              tripleTouch.numberOfTapsRequired = 2;

              for (UIWindow *w in [UIApplication sharedApplication].windows) {
                  [w addGestureRecognizer:tripleTouch];
              }

              // 4. Đồng hồ nhịp hiển thị FPS & RGB
              self.displayLink = [CADisplayLink displayLinkWithTarget:self selector:@selector(onTick:)];
              [self.displayLink addToRunLoop:[NSRunLoop mainRunLoop] forMode:NSRunLoopCommonModes];
          }

          - (void)onPan:(UIPanGestureRecognizer *)p {
              CGPoint tr = [p translationInView:self.overlayWindow.superview];
              self.overlayWindow.center = CGPointMake(self.overlayWindow.center.x + tr.x, self.overlayWindow.center.y + tr.y);
              [p setTranslation:CGPointZero inView:self.overlayWindow.superview];
          }

          - (void)onTick:(CADisplayLink *)l {
              self.hue += 0.008;
              if (self.hue > 1.0) self.hue = 0.0;
              UIColor *rainbow = [UIColor colorWithHue:self.hue saturation:1.0 brightness:1.0 alpha:1.0];
              
              self.overlayLabel.textColor = rainbow;
              self.overlayWindow.layer.borderColor = rainbow.CGColor;
              self.overlayWindow.layer.borderWidth = 1.5;

              if (self.menuContainer) {
                  self.menuContainer.layer.borderColor = rainbow.CGColor;
                  self.menuContainer.layer.borderWidth = 1.8;
              }

              self.frameCount++;
              CFTimeInterval now = CACurrentMediaTime();
              if (now - self.lastTime >= 1.0) {
                  NSInteger fps = (NSInteger)round(self.frameCount / (now - self.lastTime));
                  self.frameCount = 0; 
                  self.lastTime = now;

                  NSMutableArray *stats = [NSMutableArray array];
                  if (self.showFPS) [stats addObject:[NSString stringWithFormat:@"%ld FPS", (long)fps]];
                  if (self.showRAM) [stats addObject:[NSString stringWithFormat:@"%.0f MB", getMemoryUsage()]];

                  NSString *line1 = [NSString stringWithFormat:@"[ %@ ] - %@", self.customTitle, [stats componentsJoinedByString:@" | "]];
                  if (self.showDate) {
                      NSDateFormatter *df = [[NSDateFormatter alloc] init];
                      [df setDateFormat:@"dd/MM/yyyy HH:mm:ss"];
                      self.overlayLabel.text = [NSString stringWithFormat:@"%@\n%@", line1, [df stringFromDate:[NSDate date]]];
                  } else {
                      self.overlayLabel.text = line1;
                  }
              }
          }

          - (void)buildMenuUI {
              self.menuWindow = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.menuWindow.windowLevel = UIWindowLevelAlert + 100.0;
              self.menuWindow.backgroundColor = [UIColor colorWithWhite:0.0 alpha:0.45];
              self.menuWindow.hidden = YES;

              CGFloat w = 315; 
              CGFloat h = 390;
              CGFloat x = (self.menuWindow.bounds.size.width - w) / 2;
              CGFloat y = (self.menuWindow.bounds.size.height - h) / 2;

              self.menuContainer = [[UIView alloc] initWithFrame:CGRectMake(x, y, w, h)];
              self.menuContainer.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.10 alpha:0.92];
              self.menuContainer.layer.cornerRadius = 18.0;
              self.menuContainer.layer.masksToBounds = YES;

              UIBlurEffect *blur = [UIBlurEffect effectWithStyle:UIBlurEffectStyleDark];
              UIVisualEffectView *blurView = [[UIVisualEffectView alloc] initWithEffect:blur];
              blurView.frame = self.menuContainer.bounds;
              blurView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.menuContainer addSubview:blurView];
              [self.menuWindow addSubview:self.menuContainer];

              // Tiêu đề
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(0, 16, w, 22)];
              title.text = @"⚡ FWJZ VIP MOD MENU ⚡";
              title.textColor = [UIColor whiteColor];
              title.font = [UIFont boldSystemFontOfSize:15.5];
              title.textAlignment = NSTextAlignmentCenter;
              [self.menuContainer addSubview:title];

              // Ô nhập Custom Text
              UITextField *tf = [[UITextField alloc] initWithFrame:CGRectMake(20, 48, w - 40, 36)];
              tf.backgroundColor = [UIColor colorWithWhite:0.18 alpha:0.7];
              tf.textColor = [UIColor cyanColor];
              tf.layer.cornerRadius = 9.0;
              tf.textAlignment = NSTextAlignmentCenter;
              tf.font = [UIFont boldSystemFontOfSize:13];
              tf.text = self.customTitle;
              tf.returnKeyType = UIReturnKeyDone;
              tf.delegate = self;
              [tf addTarget:self action:@selector(onTitleChanged:) forControlEvents:UIControlEventEditingChanged];
              [self.menuContainer addSubview:tf];

              // Danh sách Switch bật/tắt
              [self makeRow:@"Hiện chỉ số FPS" y:96 sel:@selector(toggleFPS:) on:self.showFPS];
              [self makeRow:@"Hiện mức RAM (MB)" y:140 sel:@selector(toggleRAM:) on:self.showRAM];
              [self makeRow:@"Hiện Ngày & Giờ" y:184 sel:@selector(toggleDate:) on:self.showDate];

              // Card Thông tin Admin
              UIView *card = [[UIView alloc] initWithFrame:CGRectMake(20, 234, w - 40, 78)];
              card.backgroundColor = [UIColor colorWithWhite:0.12 alpha:0.8];
              card.layer.cornerRadius = 12.0;
              card.layer.borderWidth = 1.0;
              card.layer.borderColor = [UIColor colorWithWhite:0.25 alpha:0.8].CGColor;
              [self.menuContainer addSubview:card];

              UILabel *adminTitle = [[UILabel alloc] initWithFrame:CGRectMake(12, 8, card.bounds.size.width - 24, 18)];
              adminTitle.text = @"👑 MODDER : FWJZ";
              adminTitle.textColor = [UIColor colorWithRed:0.2 green:0.9 blue:0.9 alpha:1.0];
              adminTitle.font = [UIFont boldSystemFontOfSize:12.5];
              [card addSubview:adminTitle];

              UILabel *infoLabel = [[UILabel alloc] initWithFrame:CGRectMake(12, 28, card.bounds.size.width - 24, 44)];
              infoLabel.numberOfLines = 2;
              infoLabel.textColor = [UIColor colorWithWhite:0.9 alpha:1.0];
              infoLabel.font = [UIFont systemFontOfSize:11.5];
              infoLabel.text = @"• TikTok: _fwjz\n• Telegram: @fwjz0";
              [card addSubview:infoLabel];

              // Nút Đóng Menu
              UIButton *btnClose = [UIButton buttonWithType:UIButtonTypeSystem];
              btnClose.frame = CGRectMake(20, 326, w - 40, 42);
              btnClose.backgroundColor = [UIColor colorWithRed:0.92 green:0.22 blue:0.35 alpha:0.95];
              [btnClose setTitle:@"ĐÓNG MENU" forState:UIControlStateNormal];
              [btnClose setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              btnClose.titleLabel.font = [UIFont boldSystemFontOfSize:13.5];
              btnClose.layer.cornerRadius = 10.0;
              [btnClose addTarget:self action:@selector(toggleMenu) forControlEvents:UIControlEventTouchUpInside];
              [self.menuContainer addSubview:btnClose];
          }

          - (void)makeRow:(NSString *)title y:(CGFloat)y sel:(SEL)sel on:(BOOL)state {
              UILabel *lbl = [[UILabel alloc] initWithFrame:CGRectMake(24, y, 180, 31)];
              lbl.text = title;
              lbl.textColor = [UIColor whiteColor];
              lbl.font = [UIFont systemFontOfSize:13.5];
              [self.menuContainer addSubview:lbl];

              UISwitch *sw = [[UISwitch alloc] initWithFrame:CGRectMake(self.menuContainer.bounds.size.width - 75, y, 51, 31)];
              sw.on = state;
              sw.onTintColor = [UIColor colorWithRed:0.2 green:0.8 blue:0.6 alpha:1.0];
              [sw addTarget:self action:sel forControlEvents:UIControlEventValueChanged];
              [self.menuContainer addSubview:sw];
          }

          - (BOOL)textFieldShouldReturn:(UITextField *)tf {
              [tf resignFirstResponder];
              return YES;
          }

          - (void)onTitleChanged:(UITextField *)tf {
              self.customTitle = tf.text.length > 0 ? tf.text : @"fwjz";
          }
          - (void)toggleFPS:(UISwitch *)sw { self.showFPS = sw.on; }
          - (void)toggleRAM:(UISwitch *)sw { self.showRAM = sw.on; }
          - (void)toggleDate:(UISwitch *)sw { self.showDate = sw.on; }

          - (void)toggleMenu {
              self.menuWindow.hidden = !self.menuWindow.hidden;
          }

          @end

          __attribute__((constructor)) static void init(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  [[FWJZManager shared] setup];
              });
          }
          EOF

      - name: Compile dylib directly with Clang
        run: |
          xcrun -sdk iphoneos clang -target arm64-apple-ios14.0 \
            -dynamiclib -fobjc-arc -Wno-deprecated-declarations \
            -framework UIKit -framework QuartzCore -framework CoreGraphics \
            fwjz.m -o fwjz.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fwjz-dylib
          path: fwjz.dylib
